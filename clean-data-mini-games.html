<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Cleaning Mini Games | Young IT Germany</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(165deg,#ff7e5f 0%,#feb47b 28%,#e65c8a 62%,#6a3fa0 100%) fixed;font-family:Arial,Helvetica,sans-serif;font-size:20px;color:#2b1b3d}
.logo{position:fixed;top:10px;left:12px;font-size:14px;font-weight:bold;background:#fff;border-radius:20px;padding:5px 12px;box-shadow:0 2px 6px #0004;z-index:5}
.logo b{color:#6a3fa0}.logo i{color:#e8590c;font-style:normal}.logo u{color:#d6336c;text-decoration:none}
main{max-width:900px;margin:0 auto;padding:62px 14px 40px}
.ban{background:#fffffff0;border-radius:18px;padding:10px 18px;margin:10px 0;color:#4a1f6e;box-shadow:0 4px 10px #0003}
h1{font-size:38px;text-align:center;margin:0}h2{font-size:28px;margin:0}h3{margin:8px 0}
.sub{text-align:center;font-size:21px;margin-top:6px;color:#6a3fa0}
.card{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 6px 16px #0003;line-height:1.5}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:14px}
.mc{background:#fff;border:5px solid #fff;border-radius:22px;padding:14px;text-align:center;cursor:pointer;font-family:inherit;font-size:20px;color:#2b1b3d;box-shadow:0 6px 14px #0003}
.mc:hover{border-color:#ffd23f;transform:translateY(-3px)}.mc .e{font-size:50px;display:block}.mc.v{border-color:#2fb98a}
.mc small{display:block;color:#6a3fa0;font-weight:bold;margin-top:4px}
.b{background:#6a3fa0;color:#fff;border:0;border-radius:14px;padding:12px 20px;font-size:20px;font-family:inherit;cursor:pointer;margin:6px 4px}
.b.o{background:#d9480f}.b.k{background:#c2255c}.b.g{background:#0b7a6e}.b.w{background:#fff;color:#6a3fa0;border:3px solid #6a3fa0}
input[type=text]{font-size:20px;font-family:inherit;padding:10px;border:3px solid #cdb7ee;border-radius:12px;width:100%;max-width:360px}
.pill{display:inline-block;background:#ffd23f;color:#2b1b3d;border-radius:20px;padding:4px 14px;font-weight:bold;font-size:16px}
.say{display:flex;gap:12px;align-items:center;background:#fff1e6;border-left:8px solid #d9480f;border-radius:16px;padding:12px;margin:10px 0}.say .c{font-size:54px}
.tips{background:#f4ecff;border-left:8px solid #6a3fa0;border-radius:12px;padding:8px 16px;margin-top:14px;font-size:18px}.tips summary{font-weight:bold;cursor:pointer;font-size:20px}
code{background:#2a1445;color:#ffe9a8;border-radius:8px;padding:2px 8px;font-family:Consolas,monospace;font-size:18px}
pre.code{background:#2a1445;color:#ffe9a8;border-radius:12px;padding:12px;overflow-x:auto;font-size:19px;font-family:Consolas,monospace;margin:8px 0;min-height:48px}
table.t{border-collapse:collapse;width:100%;font-size:19px;margin:10px 0}
.t th{background:#6a3fa0;color:#fff;padding:9px;text-align:left}.t td{padding:8px 9px;border-bottom:2px solid #eadcfb}
.t.c td{cursor:pointer}.t.c td:hover{background:#fff1b8}.t .bad{background:#ffc9d6!important;color:#8a0f3a;font-weight:bold}.t .nan{color:#c2255c;font-style:italic}.wrap{overflow-x:auto}
.nm{background:#fff;border:3px solid #6a3fa0;color:#6a3fa0;border-radius:30px;padding:8px 18px;font-size:19px;font-weight:bold;cursor:pointer;margin:4px;font-family:inherit}.nm:disabled{opacity:.35;cursor:default}
.ok{color:#0b7a4f;font-weight:bold}.no{color:#c2255c;font-weight:bold}
.opt{display:block;width:100%;text-align:left;margin:6px 0}.opt.right{background:#0b7a4f}.opt.wrong{background:#c2255c}
.nav{display:flex;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
.hero{text-align:center;padding:24px 10px}.hero .ci{display:inline-block;border-radius:22px;overflow:hidden;box-shadow:0 8px 20px #0005;max-width:100%}
.mem{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cardm{height:96px;border:0;border-radius:14px;background:#6a3fa0;color:#fff;font-size:30px;cursor:pointer;font-family:inherit;padding:6px}
.cardm.f{background:#fff;color:#2b1b3d;border:3px solid #6a3fa0;font-size:16px;font-weight:bold}.cardm.m{background:#e3f7ee;border-color:#0b7a4f;color:#0b7a4f}
.prog{font-weight:bold;color:#6a3fa0}
.ex{background:#fff1b8;border-radius:16px;padding:16px;font-size:24px;font-weight:bold;text-align:center;margin:10px 0}
.cat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
</style></head><body>
<div class="logo"><b>Young</b> <i>IT</i> <u>Germany</u></div>
<main id="app"></main>
<script>
const G=[['🗂️','Dirt Sorter',6],['🃏','Memory Match',5],['🔎','Spot the Dirt',6],['🧱','Code Builder',4],['🛟','Rescue Bolt',4]];
let me={name:'',cls:''},S={},V={};
const $=id=>document.getElementById(id),app=$('app');
const sc=i=>Object.values(S[i]||{}).reduce((x,y)=>x+y,0);
const setS=(i,k,v)=>{S[i]=S[i]||{};S[i][k]=Math.max(S[i][k]||0,v)};
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const say=(c,t)=>`<div class="say"><div class="c">${c}</div><div>${t}</div></div>`;
const tip=l=>`<details class="tips" open><summary>💡 Tips to help you</summary><ul>${l.map(x=>`<li>${x}</li>`).join('')}</ul></details>`;
const SUN=`<svg viewBox="0 0 300 160" width="420" style="max-width:100%;display:block"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a3fa0"/><stop offset=".55" stop-color="#e65c8a"/><stop offset="1" stop-color="#ffb347"/></linearGradient></defs><rect width="300" height="160" fill="url(#sk)"/><circle cx="150" cy="108" r="44" fill="#ffd23f"/><path d="M0 122Q60 92 120 120T300 112V160H0Z" fill="#4a1f6e"/><path d="M0 140Q80 118 160 140T300 134V160H0Z" fill="#2a1445"/><line x1="150" y1="64" x2="150" y2="74" stroke="#fff" stroke-width="3"/><circle cx="150" cy="62" r="4" fill="#ff6b6b"/><rect x="134" y="74" width="32" height="26" rx="6" fill="#fff"/><circle cx="143" cy="86" r="4" fill="#6a3fa0"/><circle cx="157" cy="86" r="4" fill="#6a3fa0"/><rect x="138" y="102" width="24" height="22" rx="5" fill="#fff"/><rect x="126" y="104" width="10" height="5" rx="2" fill="#fff"/><rect x="164" y="104" width="10" height="5" rx="2" fill="#fff"/><path d="M40 40q6-8 12 0M70 28q6-8 12 0M240 46q6-8 12 0" stroke="#fff" stroke-width="2" fill="none"/></svg>`;
function mk(i,tips){V[i]=1;app.innerHTML=`<span class="pill">🎮 Game ${i+1} of 5</span><div class="ban"><h2>${G[i][0]} ${G[i][1]}</h2></div><div class="card"><div id="gm"></div>${tip(tips)}</div><div class="nav"><button class="b w" onclick="home()">⬅ Menu</button>${i<4?`<button class="b" onclick="go(${i+1})">Next Game ➡</button>`:`<button class="b o" onclick="results()">See My Results 🏆</button>`}</div>`;window.scrollTo(0,0)}
const go=i=>[g1,g2,g3,g4,g5][i]();
const nx=f=>`<button class="b o" onclick="${f}">Next ➡</button>`;
const fin=()=>say('🦊','🎉 Well done! You finished this game. Try another one from the menu!');

function splash(){app.innerHTML=`<div class="hero"><div class="ci">${SUN}</div><div class="ban" style="margin-top:20px"><h1>Data Cleaning Mini Games</h1><div class="sub">Clean the data before teaching AI</div></div><button class="b o" onclick="reg()">Begin 🚀</button></div>`}
function reg(){app.innerHTML=`<div class="card" style="text-align:center">${say('🦊','Hello, Data Cleaner! Tell me your name and class to start playing.')}<p><input type="text" id="nm" placeholder="Your name" maxlength="40"></p><p><input type="text" id="cl" placeholder="Your class (e.g. Class 6)" maxlength="20"></p><p id="er" class="no"></p><button class="b" onclick="enter()">Enter Games 🎮</button></div>`}
function enter(){const n=$('nm').value.trim(),c=$('cl').value.trim();if(!n||!c){$('er').textContent='Please type your name and class first 🙂';return}me={name:n,cls:c};home()}
function home(){app.innerHTML=`<div class="ban"><h1 style="font-size:32px">Hi ${esc(me.name)}! 🦊</h1><div class="sub">Pick any game. No timer, just fun!</div></div><div class="menu">${G.map((g,i)=>`<button class="mc ${V[i]?'v':''}" onclick="go(${i})"><span class="e">${g[0]}</span><b>${g[1]}</b><small>${'⭐'.repeat(sc(i))}${'☆'.repeat(g[2]-sc(i))}</small></button>`).join('')}<button class="mc" onclick="results()" style="border-color:#ffd23f"><span class="e">🏅</span><b>My Results</b><small>See &amp; download</small></button></div>`}

/* 1 Dirt Sorter */
const C1=[['Age: NaN','m'],['Ben, Ben (the same row twice)','d'],['Aple instead of Apple','t'],['Age: 130 for a school kid','i'],['mango and Mango in the same column','t'],['The pocket money box is empty','m']];
const CN={m:'🕳️ Missing value',d:'👯 Duplicate',t:'🔠 Typo / Spelling',i:'🚫 Impossible value'};let r1=0;
function g1(){r1=0;mk(0,['<b>Missing</b> = an empty box (NaN).','<b>Duplicate</b> = the same row two times.','<b>Typo / Spelling</b> = a spelling slip or different capital letters.','<b>Impossible</b> = a value that cannot be true.']);d1()}
function d1(){if(r1>=6){$('gm').innerHTML=fin();return}$('gm').innerHTML=`<p class="prog">Round ${r1+1} of 6</p><p>What kind of dirty data is this?</p><div class="ex">${esc(C1[r1][0])}</div><div class="cat">${Object.keys(CN).map(k=>`<button class="b" onclick="a1('${k}')">${CN[k]}</button>`).join('')}</div><div id="fb"></div>`}
function a1(k){if(k===C1[r1][1]){setS(0,'r'+r1,1);$('fb').innerHTML='<p class="ok">✅ Yes!</p>'+nx('r1++;d1()')}else $('fb').innerHTML='<p class="no">❌ Not that one. Read the tips and try again 🙂</p>'}

/* 2 Memory Match */
const P=[['df.isna().sum()','Counts missing values'],['df.dropna()','Removes rows with gaps'],['df.fillna(12)','Fills gaps with 12'],['df.drop_duplicates()','Removes repeated rows'],['.str.title()','Fixes capital letters']];let cs=[],op=[],lock=false;
function g2(){const a=[];P.forEach((p,i)=>{a.push({i,t:p[0],c:1,m:0},{i,t:p[1],c:0,m:0})});cs=a.sort(()=>Math.random()-.5);op=[];lock=false;mk(1,['Flip two cards. Match the <b>code</b> with what it <b>does</b>.','If they do not match, they flip back. Remember where they are!','<b>na</b> = missing, <b>fill</b> = put something in, <b>drop</b> = remove.']);d2()}
function d2(){const dn=cs.every(c=>c.m);$('gm').innerHTML=`<p class="prog">Matched: ${cs.filter(c=>c.m).length/2} of 5</p><div class="mem">${cs.map((c,k)=>`<button class="cardm ${c.m?'f m':op.includes(k)?'f':''}" onclick="fl(${k})">${c.m||op.includes(k)?(c.c?'<code>'+esc(c.t)+'</code>':esc(c.t)):'🦊'}</button>`).join('')}</div>${dn?fin():''}`}
function fl(k){if(lock||cs[k].m||op.includes(k))return;op.push(k);d2();if(op.length===2){const[a,b]=op;if(cs[a].i===cs[b].i){cs[a].m=cs[b].m=1;setS(1,'p'+cs[a].i,1);op=[];setTimeout(d2,400)}else{lock=true;setTimeout(()=>{op=[];lock=false;d2()},1100)}}}

/* 3 Spot the Dirt */
const RD=[{rows:[['Mia',11,'Dog'],['Leo',null,'Cat'],['Mia',11,'Dog']],bad:['1:a','2:*'],h:'One box is empty and one row is repeated.'},
{rows:[['Sara',12,'Pizza'],['Tom',13,'pizza'],['Uma',12,'Piza']],bad:['1:f','2:f'],h:'One has different capital letters and one has a typo.'},
{rows:[['Ravi',12,'Red'],['Nia',200,'Blue'],['Omar',13,null]],bad:['1:a','2:f'],h:'One value is impossible and one is missing.'}];let r3=0,fd=[];
function g3(){r3=0;fd=[];mk(2,['Each table hides <b>2 problems</b>. The hint tells you what kinds.','Tap a box you think is wrong. Wrong guesses are okay!','For a repeated row, tap any box in that row.']);d3()}
function d3(){if(r3>=3){$('gm').innerHTML=fin();return}const R=RD[r3],C=['n','a','f'];
 $('gm').innerHTML=`<p class="prog">Table ${r3+1} of 3</p><p>🔦 Hint: ${R.h}</p><div class="wrap"><table class="t c"><tr><th>Name</th><th>Age</th><th>Favourite</th></tr>${R.rows.map((r,i)=>`<tr>${r.map((v,j)=>`<td class="${fd.includes(i+':'+C[j])||(fd.includes(i+':*'))?'bad':''} ${v===null?'nan':''}" onclick="det(${i},'${C[j]}')">${v===null?'NaN':v}</td>`).join('')}</tr>`).join('')}</table></div><p><b>Found ${fd.length} of 2</b></p><div id="fb"></div>${fd.length===2?nx('r3++;fd=[];d3()'):''}`}
function det(i,c){const R=RD[r3],k=R.bad.find(b=>b===i+':'+c||b===i+':*'&&b.split(':')[0]==i);if(!k){d3();$('fb').innerHTML='<p class="no">That looks fine 🙂 Keep searching!</p>';return}if(!fd.includes(k)){fd.push(k);setS(2,'t'+r3+k,1)}d3();$('fb').innerHTML=fd.length===2?'<p class="ok">✅ Table cleaned! Both found!</p>':'<p class="ok">✅ Great catch!</p>'}

/* 4 Code Builder */
const K=[['Count the missing values',['df','.isna','()','.sum','()']],['Remove repeated rows',['df','.drop_duplicates','()']],['Fill the empty Age with 12',['df',"['Age']",'.fillna','(12)']],['Fix the capital letters in Fruit',['df',"['Fruit']",'.str','.title','()']]];let r5=0,tk=[],bt=[];
function g4(){r5=0;mk(3,['Tap the pieces in the right order to build the code line.','Always start with <code>df</code>.','Made a mistake? Use Undo or Clear.']);d5()}
function d5(){if(r5>=K.length){$('gm').innerHTML=fin();return}tk=K[r5][1].map((t,i)=>({t,i})).sort(()=>Math.random()-.5);bt=[];dr5()}
function dr5(){const k=K[r5];$('gm').innerHTML=`<p class="prog">Build ${r5+1} of 4</p><p><b>Goal:</b> ${k[0]}</p><pre class="code">${esc(bt.map(i=>tk.find(x=>x.i===i).t).join(''))}</pre>${tk.map(x=>`<button class="nm" ${bt.includes(x.i)?'disabled':''} onclick="pk(${x.i})">${esc(x.t)}</button>`).join('')}<br><button class="b w" onclick="bt.pop();dr5()">↩ Undo</button><button class="b w" onclick="bt=[];dr5()">Clear</button><div id="fb"></div>`}
function pk(i){bt.push(i);dr5();if(bt.length===tk.length){const s=bt.map(j=>tk.find(x=>x.i===j).t).join(''),ok=s===K[r5][1].join('');if(ok){setS(3,'k'+r5,1);$('fb').innerHTML='<p class="ok">✅ Perfect code!</p>'+nx('r5++;d5()')}else $('fb').innerHTML='<p class="no">❌ Not quite. Press Clear and try again.</p>'}}

/* 5 Rescue Bolt */
const B=[['Bolt says the average age of our school club is 32! What should we do first?',['Believe Bolt','Look at the data for dirty values','Switch Bolt off forever'],1,'Always LOOK first. An age like 130 can hide in the data!'],['Two rows are exactly the same. What do we do?',['Keep both','Keep only one copy','Delete the whole table'],1,'Repeated rows count twice and confuse the AI.'],["Chitra's age is empty. Which is a sensible fix?",['Fill it with a sensible age like 12','Fill it with 1000','Do nothing and hope'],0,'Fill gaps with a sensible number, or remove the row.'],['What is the right order for cleaning?',['Fix, Look, Check, Find','Look, Find, Fix, Check','Check, Fix, Find, Look'],1,'Look, Find, Fix, then Check again!']];let r6=0;
function g5(){r6=0;mk(4,['Bolt the robot needs your help. Think like a data cleaner!','Clean data first, then teach the AI.','Remember the recipe: Look, Find, Fix, Check.']);d6()}
function d6(){if(r6>=B.length){$('gm').innerHTML=fin();return}const b=B[r6];$('gm').innerHTML=`<p class="prog">Rescue ${r6+1} of 4</p>${say('🤖',esc(b[0]))}${b[1].map((o,j)=>`<button class="b opt" onclick="a6(${j},this)">${esc(o)}</button>`).join('')}<div id="fb"></div>`}
function a6(j,el){const b=B[r6];if(j===b[2]){el.classList.add('right');setS(4,'b'+r6,1);$('fb').innerHTML=`<p class="ok">✅ ${b[3]}</p>`+nx('r6++;d6()')}else{el.classList.add('wrong');$('fb').innerHTML='<p class="no">❌ Not that one. Think again!</p>'}}

function results(){const tot=G.reduce((s,_,i)=>s+sc(i),0),mx=G.reduce((s,g)=>s+g[2],0);
 app.innerHTML=`<div class="ban"><h1>🏅 My Results</h1></div><div class="card"><p><b>Name:</b> ${esc(me.name)} &nbsp; <b>Class:</b> ${esc(me.cls)}</p><table class="t"><tr><th>Game</th><th>Points</th><th>Stars</th></tr>${G.map((g,i)=>`<tr><td>${g[0]} ${g[1]}</td><td>${sc(i)} / ${g[2]}</td><td>${'⭐'.repeat(sc(i))}${'☆'.repeat(g[2]-sc(i))}</td></tr>`).join('')}<tr><th>Total</th><th colspan="2">${tot} / ${mx}</th></tr></table>
${say('🦊',tot>=mx*.8?'Fantastic! You are a real Data Cleaner! 🎉':'Great effort! Play more games to earn more stars ⭐')}<button class="b o" onclick="dl()">📥 Download my result (PDF)</button></div><button class="b w" onclick="home()">⬅ Back to Menu</button>`}
function dl(){const tot=G.reduce((s,_,i)=>s+sc(i),0),mx=G.reduce((s,g)=>s+g[2],0);
 const L=[['Young IT Germany',12],['Data Cleaning Mini Games',22],['',8],['Name: '+me.name,16],['Class: '+me.cls,16],['Date: '+new Date().toLocaleDateString(),12],['',8],...G.map((g,i)=>[g[1]+':  '+sc(i)+' / '+g[2],15]),['',8],['Total points: '+tot+' / '+mx,20],['',8],['Great work, Data Cleaner!',14]];
 let y=790,c='BT\n';L.forEach(l=>{c+=`/F1 ${l[1]} Tf 1 0 0 1 50 ${y} Tm (${l[0].replace(/[^\x20-\x7e]/g,'?').replace(/([\\()])/g,'\\$1')}) Tj\n`;y-=l[1]+14});c+='ET';
 const O=['<</Type/Catalog/Pages 2 0 R>>','<</Type/Pages/Kids[3 0 R]/Count 1>>','<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Contents 4 0 R/Resources<</Font<</F1 5 0 R>>>>>>',`<</Length ${c.length}>>\nstream\n${c}\nendstream`,'<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>'];
 let p='%PDF-1.4\n',off=[];O.forEach((o,i)=>{off.push(p.length);p+=`${i+1} 0 obj\n${o}\nendobj\n`});const x=p.length;
 p+=`xref\n0 ${O.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${O.length+1}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`;
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([p],{type:'application/pdf'}));a.download='clean-data-games-'+me.name.replace(/\W+/g,'_')+'.pdf';document.body.appendChild(a);a.click();a.remove()}
splash();
</script></body></html>
